<!DOCTYPE html>
<!--
  © 2026 Tyler Janczak. All rights reserved.
  bridges.tylerjanczak.com — full-screen Tyler AI

  This page intentionally has no chat logic of its own. It loads the
  exact same js/tyler-ai.js used everywhere else on the main site, then
  restyles the widget to fill the screen and auto-opens it, so this page
  always has 100% feature parity with the normal chat widget (resume
  delivery, scheduling, moderation, everything) with zero duplicated code.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Tyler AI</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F7F5F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    /* Restyle the floating widget to fill the entire viewport instead
       of sitting as a small panel in the corner. */
    #tyler-ai-widget {
      position: fixed !important;
      inset: 0 !important;
    }

    #tyler-ai-launcher {
      display: none !important;
    }

    #tyler-ai-panel {
      position: fixed !important;
      inset: 0 !important;
      right: auto !important;
      bottom: auto !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      border: none !important;
    }

    /* A small loading state shown before the widget finishes initializing
       (its status check, ban check, etc.) — replaced automatically once
       the panel opens. */
    #bridges-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #4A4A48;
      font-size: 14px;
      letter-spacing: 0.02em;
      overflow: hidden;
    }

    /* Heart + ECG loading animation — matches the dashboard's own
       "Authenticating…" style and the getdetails.do gate, for visual
       consistency across the whole chat-access flow. */
    #bridges-loading-walker {
      width: 58px;
      height: 52px;
    }

    #bridges-loading-walker svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .bridges-heart-fill {
      fill: #C84545;
      animation: bridgesHeartBeat 1.1s ease-in-out infinite;
      transform-origin: center;
    }

    .bridges-ecg-line {
      fill: none;
      stroke: #F7F4EE;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: bridgesEcgDraw 1.5s linear infinite;
    }

    @keyframes bridgesHeartBeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.08); }
      50% { transform: scale(0.98); }
    }

    @keyframes bridgesEcgDraw {
      0% { stroke-dashoffset: 100; opacity: 1; }
      65% { stroke-dashoffset: 0; opacity: 1; }
      85% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bridges-heart-fill,
      .bridges-ecg-line {
        animation: none;
      }
    }

    /* ============================================
       INVALID SESSION ERROR PAGE
       Matches the site's established "Error" page
       design exactly — doodle background, red
       Fraunces heading, pill-style back link.
       ============================================ */
    #bridges-invalid-session {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      background-color: #FBFBFB;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480' viewBox='0 0 480 480'><g fill='%23CCCCCC' stroke='%23CCCCCC' stroke-linecap='round' stroke-linejoin='round'><g stroke-width='1.4' fill='none'><path d='M40 55 Q48 40 56 55 L54 78 Q48 84 42 78 Z'/><path d='M42 78 L38 88 M54 78 L58 88 M48 78 L48 92'/></g><g stroke-width='1.4' fill='none'><path d='M155 40 Q163 25 171 40 L169 63 Q163 69 157 63 Z'/><path d='M157 63 L153 73 M169 63 L173 73 M163 63 L163 77'/></g><g stroke-width='1.4' fill='none'><path d='M320 60 Q328 45 336 60 L334 83 Q328 89 322 83 Z'/><path d='M322 83 L318 93 M334 83 L338 93 M328 83 L328 97'/></g><g stroke-width='1.4' fill='none'><path d='M85 175 Q93 160 101 175 L99 198 Q93 204 87 198 Z'/><path d='M87 198 L83 208 M99 198 L103 208 M93 198 L93 212'/></g><g stroke-width='1.4' fill='none'><path d='M245 195 Q253 180 261 195 L259 218 Q253 224 247 218 Z'/><path d='M247 218 L243 228 M259 218 L263 228 M253 218 L253 232'/></g><g stroke-width='1.4' fill='none'><path d='M400 145 Q408 130 416 145 L414 168 Q408 174 402 168 Z'/><path d='M402 168 L398 178 M414 168 L418 178 M408 168 L408 182'/></g><g stroke-width='1.4' fill='none'><path d='M55 310 Q63 295 71 310 L69 333 Q63 339 57 333 Z'/><path d='M57 333 L53 343 M69 333 L73 343 M63 333 L63 347'/></g><g stroke-width='1.4' fill='none'><path d='M195 340 Q203 325 211 340 L209 363 Q203 369 197 363 Z'/><path d='M197 363 L193 373 M209 363 L213 373 M203 363 L203 377'/></g><g stroke-width='1.4' fill='none'><path d='M355 310 Q363 295 371 310 L369 333 Q363 339 357 333 Z'/><path d='M357 333 L353 343 M369 333 L373 343 M363 333 L363 347'/></g><g stroke-width='1.4' fill='none'><path d='M120 415 Q128 400 136 415 L134 438 Q128 444 122 438 Z'/><path d='M122 438 L118 448 M134 438 L138 448 M128 438 L128 452'/></g><g stroke-width='1.4' fill='none'><path d='M290 425 Q298 410 306 425 L304 448 Q298 454 292 448 Z'/><path d='M292 448 L288 458 M304 448 L308 458 M298 448 L298 462'/> x='75' cy='240' r='8'/></g><g stroke-width='1.3' fill='none'><ellipse cx='370' cy='210' rx='18' ry='5' transform='rotate(-8 370 210)'/><circle cx='370' cy='210' r='9'/></g><g stroke-width='1.3' fill='none'><ellipse cx='150' cy='290' rx='16' ry='5' transform='rotate(15 150 290)'/><circle cx='150' cy='290' r='8'/></g><g stroke-width='1.3' fill='none'><ellipse cx='305' cy='375' rx='17' ry='5' transform='rotate(-12 305 375)'/><circle cx='305' cy='375' r='8.5'/></g><g stroke-width='1.3' fill='none'><ellipse cx='440' cy='320' rx='16' ry='5' transform='rotate(5 440 320)'/><circle cx='440' cy='320' r='8'/></g><g stroke-width='1.3' fill='none'><path d='M255 60 Q260 55 264 60 Q268 64 264 68 Q260 72 256 68 Q253 64 256 60 M264 60 Q270 50 275 60 M256 68 Q250 72 246 68'/></g><g stroke-width='1.3' fill='none'><path d='M35 210 Q40 205 44 210 Q48 214 44 218 Q40 222 36 218 Q33 214 36 210 M44 210 Q50 200 55 210 M36 218 Q30 222 26 218'/></g><g stroke-width='1.3' fill='none'><path d='M290 285 Q295 280 299 285 Q303 289 299 293 Q295 297 291 293 Q288 289 291 285 M299 285 Q305 275 310 285 M291 293 Q285 297 281 293'/></g><g stroke-width='1.3' fill='none'><path d='M415 385 Q420 380 424 385 Q428 389 424 393 Q420 397 416 393 Q413 389 416 385 M424 385 Q430 375 435 385 M416 393 Q410 397 406 393'/></g><g stroke-width='1.3' fill='none'><path d='M180 205 Q185 200 189 205 Q193 209 189 213 Q185 217 181 213 Q178 209 181 205 M189 205 Q195 195 200 205 M181 213 Q175 217 171 213'/></g><g stroke='none'><path d='M395 285 Q395 280 400 279 L410 279 Q415 280 415 285 L415 293 Q413 296 411 296 L410 300 L408 300 L408 296 L402 296 L402 300 L400 300 L400 296 Q397 296 395 293 Z M393 282 L397 279 M415 282 L418 279'/></g><g stroke='none'><path d='M105 355 Q105 350 110 349 L120 349 Q125 350 125 355 L125 363 Q123 366 121 366 L120 370 L118 370 L118 366 L112 366 L112 370 L110 370 L110 366 Q107 366 105 363 Z M103 352 L107 349 M125 352 L128 349'/></g><g stroke='none'><path d='M240 155 Q240 150 245 149 L255 149 Q260 150 260 1       background-repeat: repeat;
      background-size: 480px 480px;
    }

    #bridges-invalid-session.visible {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #bridges-invalid-session::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(251, 251, 251, 0.6) 0%, rgba(251, 251, 251, 0) 70%);
      pointer-events: none;
    }

    .bridges-error-card {
      position: relative;
      background: #FFFFFF;
      max-width: 520px;
      width: 100%;
      padding: 48px 44px;
      border-radius: 6px;
      border: 1px solid #E5E5E5;
      box-shadow: 0 1px 3px rgba(27,27,27,0.04), 0 12px 40px rgba(27,27,27,0.08);
      text-align: left;
    }

    .bridges-error-heading {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 500;
      font-size: 42px;
      line-height: 1;
      color: #B21F1F;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .bridges-error-message {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: #4A4A48;
      margin-bottom: 36px;
    }

    .bridges-error-back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #D93838;
      text-decoration: none;
      border: 1px solid #D93838;
      border-radius: 999px;
      padding: 4px 20px 4px 4px;
      background: #FFFFFF;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .bridges-error-back-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #D93838;
      color: #FFFFFF;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .bridges-error-back-icon svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .bridges-error-back-link:hover {
      background: rgba(217, 56, 56, 0.06);
      transform: translateY(-1px);
      box-shadow: 0 0 0 3px rgba(217, 56, 56, 0.15);
    }

    .bridges-error-back-link:hover .bridges-error-back-icon {
      transform: translateX(-2px);
    }

    .bridges-error-footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #E5E5E5;
      font-family: "Fraunces", Georgia, serif;
      font-size: 11px;
      color: #4A4A48;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .bridges-error-footer span {
      color: #1B1B1B;
      font-weight: 500;
    }

    @media (max-width: 540px) {
      .bridges-error-card {
        padding: 36px 28px;
      }
      .bridges-error-heading {
        font-size: 34px;
      }
      .bridges-error-message {
        font-size: 14px;
      }
      #bridges-invalid-session {
        background-size: 380px 380px;
      }
    }

    /* Failure-state warning icon, matching the site's existing
       hard-stop striped-triangle icon used elsewhere. */
    #bridges-loading-warning {
      align-items: center;
      justify-content: center;
    }

    .bridges-warning-icon-wrap {
      width: 60px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    .bridges-warning-icon-stripes {
      height: 46px;
      background: repeating-linear-gradient(-45deg, #d94a40, #d94a40 5px, #b3261e 5px, #b3261e 10px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Expandable diagnostic details, shown only on failure. */
    #bridges-loading-diagnostics {
      max-width: 420px;
      width: 90%;
      font-size: 12.5px;
      color: #55697D;
    }

    #bridges-loading-diagnostics summary {
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      color: #7B1F2A;
      letter-spacing: 0.02em;
      list-style: none;
    }

    #bridges-loading-diagnostics summary::-webkit-details-marker {
      display: none;
    }

    #bridges-loading-diagnostics summary::after {
      content: " ▾";
    }

    #bridges-loading-diagnostics[open] summary::after {
      content: " ▴";
    }

    #bridges-diagnostic-content {
      margin-top: 12px;
      padding: 14px 16px;
      background: #ffffff;
      border: 1px solid #D6E3EF;
      border-radius: 8px;
      line-height: 1.7;
      word-break: break-word;
    }

    #bridges-diagnostic-content strong {
      color: #1A2B3C;
    }

    /* Replace the widget's own small "×" close button with our own
       "Back to Home" pill, since closing this page should mean leaving
       the subdomain entirely, not just collapsing a popup. */
    #tyler-ai-close {
      display: none !important;
    }

    #bridges-back-home {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000000;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px 8px 8px;
      background: #ffffff;
      border: 1.5px solid #c0392b;
      border-radius: 999px;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c0392b;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      transition: box-shadow 140ms ease;
    }

    #bridges-back-home:hover {
      box-shadow: 0 8px 22px rgba(0,0,0,0.13);
    }

    #bridges-back-home-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #c0392b;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #bridges-back-home-icon svg {
      width: 15px;
      height: 15px;
    }

    #bridges-back-home-spinner {
      display: none;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: bridgesSpin 0.7s linear infinite;
    }

    #bridges-back-home.loading #bridges-back-home-arrow {
      display: none;
    }

    #bridges-back-home.loading #bridges-back-home-spinner {
      display: block;
    }

    @keyframes bridgesSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <button id="bridges-back-home" type="button" aria-label="Back to Home">
    <span id="bridges-back-home-icon">
      <svg id="bridges-back-home-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="bridges-back-home-spinner"></span>
    </span>
    Back to Home
  </button>

  <div id="bridges-invalid-session">
    <div class="bridges-error-card">
      <h1 class="bridges-error-heading">Error</h1>
      <p class="bridges-error-message">Invalid Session</p>

      <a href="https://tylerjanczak.com" class="bridges-error-back-link" id="bridges-error-back-link">
        <span class="bridges-error-back-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M7 12 L11 8 M7 12 L11 16 M7 12 L14 12 A4 4 0 0 1 18 16 L18 19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Back to Home
      </a>

      <div class="bridges-error-footer">
        © 2026 <span>Tyler Janczak</span>
      </div>
    </div>
  </div>

  <div id="bridges-loading">
    <div id="bridges-loading-walker">
      <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path class="bridges-heart-fill" d="M100 165 C 40 120, 10 80, 10 50 C 10 28, 28 10, 50 10 C 68 10, 86 22, 100 40 C 114 22, 132 10, 150 10 C 172 10, 190 28, 190 50 C 190 80, 160 120, 100 165 Z"/>
        <path class="bridges-ecg-line" pathLength="100" d="M 0 90 L 30 90 Q 38 85 46 90 Q 54 95 60 90 L 80 90 L 86 87 L 90 95 L 94 60 L 98 115 L 102 90 L 110 90 Q 118 80 130 90 Q 142 100 150 90 L 200 90"/>
      </svg>
    </div>

    <!-- Shown only if loading fails, matching the site's existing
         hard-stop warning icon style. -->
    <div id="bridges-loading-warning" style="display: none;">
      <div class="bridges-warning-icon-wrap">
        <div class="bridges-warning-icon-stripes">
          <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2 L23 21 L1 21 Z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
            <rect x="11" y="9" width="2" height="6" fill="#ffffff"/>
            <rect x="11" y="16.5" width="2" height="2" fill="#ffffff"/>
          </svg>
        </div>
      </div>
    </div>

    <div id="bridges-loading-text">Loading Tyler AI…</div>

    <details id="bridges-loading-diagnostics" style="display: none;">
      <summary>Diagnostic details</summary>
      <div id="bridges-diagnostic-content"></div>
    </details>
  </div>

  <script>
    // The only legitimate way into this page: a valid, server-issued,
    // single-use session token from getdetails.do. Checked before
    // anything else runs — tyler-ai.js itself is never even loaded
    // unless this passes.
    (function checkBridgesSession() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("sid");

      if (!sessionId) {
        showInvalidSession();
        return;
      }

      fetch("https://tylerjanczak-github-io.vercel.app/api/chat", {
        method: "POST",
        mode: "cors",
        cache: "no-store",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "validate-session", sessionId: sessionId })
      })
        .then(function (res) { return res.json(); })
        .catch(function () { return { valid: false }; })
        .then(function (data) {
          if (data && data.valid) {
            loadTylerAiScript();
          } else {
            showInvalidSession();
          }
        });
    })();

    function loadTylerAiScript() {
      const script = document.createElement("script");
      script.src = "js/tyler-ai.js";
      script.defer = true;
      document.body.appendChild(script);
      initBridgesLoadingWatchers(script);
    }

    function showInvalidSession() {
      const loadingEl = document.getElementById("bridges-loading");
      const errorPageEl = document.getElementById("bridges-invalid-session");

      if (loadingEl) loadingEl.style.display = "none";
      if (errorPageEl) errorPageEl.classList.add("visible");
    }
  </script>

  <script>
    document.getElementById("bridges-back-home").addEventListener("click", function (event) {
      var btn = event.currentTarget;
      if (btn.classList.contains("loading")) return;
      btn.classList.add("loading");
      window.setTimeout(function () {
        window.location.href = "https://tylerjanczak.com";
      }, 500);
    });
  </script>

  <script>
    // Tracks whether the script tag itself ever loaded, distinct from
    // whether it loaded but failed to initialize — genuinely different
    // failure modes, shown separately in the diagnostic details below.
    var bridgesScriptLoaded = false;
    var bridgesScriptError = null;

    function initBridgesLoadingWatchers(scriptEl) {
      if (scriptEl) {
        scriptEl.addEventListener("load", function () {
          bridgesScriptLoaded = true;
        });
        scriptEl.addEventListener("error", function () {
          bridgesScriptError = "The script file itself failed to load (network error or 404).";
        });
      }

      // Wait for the widget to finish initializing (it does its own async
      // status/ban check before building anything), then open it and
      // remove the loading state. If the site is blocked or under
      // maintenance, tyler-ai.js will have already replaced the page
      // content itself, so this simply won't find anything to open.
      var attempts = 0;
      var interval = setInterval(function () {
        attempts++;

        if (window.TylerAI && typeof window.TylerAI.open === "function") {
          window.TylerAI.open();
          var loading = document.getElementById("bridges-loading");
          if (loading) loading.remove();
          clearInterval(interval);
          return;
        }

        // Give up after ~8 seconds so a broken load doesn't hang forever.
        if (attempts > 80) {
          clearInterval(interval);
          showBridgesFailureState();
        }
      }, 100);
    }


    async function runBridgesDiagnostics() {
      var diagnostics = {
        secureConnection: window.location.protocol === "https:",
        online: typeof navigator.onLine === "boolean" ? navigator.onLine : null,
        sessionStorageAvailable: false,
        apiReachable: null,
        apiResponseTime: null,
        apiError: null
      };

      try {
        sessionStorage.setItem("__bridges_diag_test__", "1");
        sessionStorage.removeItem("__bridges_diag_test__");
        diagnostics.sessionStorageAvailable = true;
      } catch (e) {
        diagnostics.sessionStorageAvailable = false;
      }

      // A real, live fetch to the same status API tyler-ai.js depends on —
      // not an assumption, an actual test of reachability right now.
      var apiStart = (window.performance && performance.now) ? performance.now() : Date.now();
      try {
        var controller = new AbortController();
        var timeoutId = window.setTimeout(function () { controller.abort(); }, 3000);

        var res = await fetch("https://tylerjanczak-github-io.vercel.app/api/chat-config", {
          cache: "no-store",
          signal: controller.signal
        });

        window.clearTimeout(timeoutId);
        diagnostics.apiResponseTime = Math.round(((window.performance && performance.now) ? performance.now() : Date.now()) - apiStart);
        diagnostics.apiReachable = res.ok;
        if (!res.ok) {
          diagnostics.apiError = "Server responded with HTTP " + res.status;
        }
      } catch (err) {
        diagnostics.apiResponseTime = Math.round(((window.performance && performance.now) ? performance.now() : Date.now()) - apiStart);
        diagnostics.apiReachable = false;
        diagnostics.apiError = err.name === "AbortError"
          ? "Request timed out after 3 seconds"
          : (err.message || "Unknown network error");
      }

      return diagnostics;
    }

    async function showBridgesFailureState() {
      var loadingTextEl = document.getElementById("bridges-loading-text");
      var walkerEl = document.getElementById("bridges-loading-walker");
      var warningEl = document.getElementById("bridges-loading-warning");
      var diagnosticsEl = document.getElementById("bridges-loading-diagnostics");
      var diagnosticContentEl = document.getElementById("bridges-diagnostic-content");

      if (loadingTextEl) {
        loadingTextEl.textContent = "Tyler AI couldn't load right now. Please try again later.";
      }

      if (walkerEl) {
        // Stop the outer traverse and every nested limb/bob animation
        // so the figure freezes cleanly instead of walking in place.
        var allAnimated = walkerEl.querySelectorAll("*");
        walkerEl.style.animation = "none";
        for (var i = 0; i < allAnimated.length; i++) {
          allAnimated[i].style.animation = "none";
        }
        walkerEl.style.display = "none";
      }

      if (warningEl) {
        warningEl.style.display = "flex";
      }

      if (!diagnosticsEl || !diagnosticContentEl) return;

      diagnosticsEl.style.display = "block";
      diagnosticContentEl.innerHTML = "<div>Running diagnostic checks…</div>";

      var d = await runBridgesDiagnostics();

      var likelyCause;
      if (bridgesScriptError) {
        likelyCause = bridgesScriptError;
      } else if (!d.secureConnection) {
        likelyCause = "This page isn't loading over a secure (HTTPS) connection, which browsers block API requests from by default.";
      } else if (d.online === false) {
        likelyCause = "This device appears to be offline.";
      } else if (d.apiReachable === false) {
        likelyCause = "The chat API didn't respond successfully (" + (d.apiError || "unknown error") + "). The backend service may be down or misconfigured.";
      } else if (bridgesScriptLoaded) {
        likelyCause = "The script loaded and the API is reachable, but initialization still didn't complete in time. This may indicate a JavaScript error partway through execution.";
      } else {
        likelyCause = "The script tag never reported loading successfully or failing, which is unusual.";
      }

      diagnosticContentEl.innerHTML =
        "<div><strong>Time:</strong> " + new Date().toString() + "</div>" +
        "<div><strong>Script loaded:</strong> " + (bridgesScriptLoaded ? "Yes" : "No") + "</div>" +
        "<div><strong>Secure connection (HTTPS):</strong> " + (d.secureConnection ? "Yes" : "No") + "</div>" +
        "<div><strong>Device online:</strong> " + (d.online === null ? "Unknown" : (d.online ? "Yes" : "No")) + "</div>" +
        "<div><strong>Session storage available:</strong> " + (d.sessionStorageAvailable ? "Yes" : "No") + "</div>" +
        "<div><strong>Chat API reachable:</strong> " + (d.apiReachable === null ? "Unknown" : (d.apiReachable ? "Yes" : "No")) +
          (d.apiResponseTime !== null ? " (" + d.apiResponseTime + "ms)" : "") + "</div>" +
        (d.apiError ? "<div><strong>API error:</strong> " + d.apiError + "</div>" : "") +
        "<div><strong>Likely cause:</strong> " + likelyCause + "</div>" +
        "<div><strong>Browser:</strong> " + navigator.userAgent + "</div>";
    }
  </script>

</body>
</html>
