<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Tyler Janczak</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@simplewebauthn/browser@13/dist/bundle/index.umd.min.js"></script>
<style>
  :root {
    --bg: #F7F4EE;
    --bg-subtle: #EFEAE0;
    --ink: #1B1B1B;
    --ink-soft: #4A4A48;
    --rule: #D9D2C4;
    --accent: #6B1F1F;
    --display: "Fraunces", Georgia, serif;
    --body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 48px 28px 100px; }
  h1 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 32px;
    margin-bottom: 6px;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 40px;
  }

  /* Gate screens */
  #gate {
    max-width: 420px;
    margin: 80px auto 0;
    text-align: center;
    padding: 40px 32px;
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 10px;
  }
  #gate h2 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 22px;
    margin-bottom: 10px;
  }
  #gate p {
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 22px;
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 14px;
    background: var(--bg);
    color: var(--ink);
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button.primary {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  button.primary:hover { background: #551818; }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  #gate-error {
    color: var(--accent);
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
  }
  .gate-toggle {
    margin-top: 20px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .gate-toggle a {
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
  }

  /* Dashboard content */
  #dashboard { display: none; }
  section.panel {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 10px;
    margin-bottom: 32px;
    overflow: hidden;
  }
  .panel-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-header h2 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 18px;
  }
  .panel-count {
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--bg-subtle);
    padding: 4px 10px;
    border-radius: 999px;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    padding: 10px 22px;
    background: var(--bg-subtle);
  }
  td {
    padding: 12px 22px;
    font-size: 13.5px;
    border-top: 1px solid var(--rule);
    vertical-align: top;
  }
  td.timestamp {
    white-space: nowrap;
    color: var(--ink-soft);
    font-size: 12.5px;
  }
  .empty-row {
    padding: 28px 22px;
    color: var(--ink-soft);
    font-size: 13.5px;
    text-align: center;
  }
  #sign-out {
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div id="gate">
  <h2 id="gate-title">Sign In</h2>
  <p id="gate-subtitle">Use your passkey to access the dashboard.</p>

  <div id="signin-view">
    <button class="primary" id="signin-btn">Sign in with Passkey</button>
    <div class="gate-toggle" id="register-toggle" style="display: none;">
      No passkey set up yet? <a id="show-register">Register one</a>
    </div>
  </div>

  <div id="register-view" style="display: none;">
    <input type="password" id="register-password" placeholder="Dashboard password" autocomplete="off" />
    <button class="primary" id="register-btn">Register Passkey</button>
    <div class="gate-toggle">
      Already have a passkey? <a id="show-signin">Sign in instead</a>
    </div>
  </div>

  <div id="gate-error"></div>
</div>

<div class="container" id="dashboard">
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <h1>Dashboard</h1>
      <p class="subtitle">Conversations and resume requests from Tyler AI.</p>
    </div>
    <span id="sign-out">Sign out</span>
  </div>

  <section class="panel">
    <div class="panel-header">
      <h2>Conversations</h2>
      <span class="panel-count" id="conv-count">0</span>
    </div>
    <table>
      <thead>
        <tr><th style="width:160px;">When</th><th>Question</th><th>Answer</th></tr>
      </thead>
      <tbody id="conv-body"></tbody>
    </table>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Resume Requests</h2>
      <span class="panel-count" id="resume-count">0</span>
    </div>
    <table>
      <thead>
        <tr><th style="width:160px;">When</th><th>Email</th></tr>
      </thead>
      <tbody id="resume-body"></tbody>
    </table>
  </section>
</div>

<script>
  const API_BASE = "https://tylerjanczak-github-io.vercel.app";
  const SESSION_KEY = "tylerDashboardSession";
  const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;

  const gate = document.getElementById("gate");
  const dashboard = document.getElementById("dashboard");
  const gateError = document.getElementById("gate-error");
  const signinView = document.getElementById("signin-view");
  const registerView = document.getElementById("register-view");
  const gateTitle = document.getElementById("gate-title");
  const gateSubtitle = document.getElementById("gate-subtitle");

  // The "Register one" link stays hidden for a cleaner sign-in screen.
  // Visit dashboard.html?setup=1 to reveal it when adding a new device.
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get("setup") === "1") {
    document.getElementById("register-toggle").style.display = "block";
  }

  document.getElementById("show-register").addEventListener("click", () => {
    signinView.style.display = "none";
    registerView.style.display = "block";
    gateTitle.textContent = "Set Up Passkey";
    gateSubtitle.textContent = "Enter the dashboard password once to register your passkey.";
    gateError.textContent = "";
  });

  document.getElementById("show-signin").addEventListener("click", () => {
    registerView.style.display = "none";
    signinView.style.display = "block";
    gateTitle.textContent = "Sign In";
    gateSubtitle.textContent = "Use your passkey to access the dashboard.";
    gateError.textContent = "";
  });

  document.getElementById("sign-out").addEventListener("click", () => {
    localStorage.removeItem(SESSION_KEY);
    dashboard.style.display = "none";
    gate.style.display = "block";
  });

  async function registerPasskey() {
    gateError.textContent = "";
    const password = document.getElementById("register-password").value.trim();

    if (!password) {
      gateError.textContent = "Enter the dashboard password.";
      return;
    }

    try {
      const optionsRes = await fetch(`${API_BASE}/api/webauthn-register-options`, {
        method: "POST",
        headers: { Authorization: `Bearer ${password}` }
      });

      const options = await optionsRes.json();

      if (!optionsRes.ok) {
        gateError.textContent = options.error || "Incorrect password.";
        return;
      }

      console.log("Registration options received from server:", options);
      const attResp = await startRegistration({ optionsJSON: options });

      const verifyRes = await fetch(`${API_BASE}/api/webauthn-register-verify`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${password}`
        },
        body: JSON.stringify({ response: attResp })
      });

      const verifyData = await verifyRes.json();

      if (!verifyRes.ok || !verifyData.verified) {
        gateError.textContent = verifyData.error || "Registration failed.";
        return;
      }

      gateError.style.color = "#2e7d32";
      gateError.textContent = "Passkey registered! Signing you in...";
      await signInPasskey();
    } catch (err) {
      console.error(err);
      gateError.textContent = "Registration failed: " + (err.message || err.name || "unknown error");
    }
  }

  async function signInPasskey() {
    gateError.textContent = "";

    try {
      const optionsRes = await fetch(`${API_BASE}/api/webauthn-auth-options`, {
        method: "POST"
      });

      const options = await optionsRes.json();

      if (!optionsRes.ok) {
        gateError.textContent = options.error || "No passkey registered yet.";
        return;
      }

      const authResp = await startAuthentication({ optionsJSON: options });

      const verifyRes = await fetch(`${API_BASE}/api/webauthn-auth-verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ response: authResp })
      });

      const verifyData = await verifyRes.json();

      if (!verifyRes.ok || !verifyData.verified) {
        gateError.textContent = verifyData.error || "Sign-in failed.";
        return;
      }

      localStorage.setItem(SESSION_KEY, verifyData.sessionToken);
      await loadDashboard();
    } catch (err) {
      console.error(err);
      gateError.textContent = "Sign-in failed: " + (err.message || err.name || "unknown error");
    }
  }

  document.getElementById("register-btn").addEventListener("click", registerPasskey);
  document.getElementById("signin-btn").addEventListener("click", signInPasskey);

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleString();
    } catch {
      return iso;
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  async function loadDashboard() {
    const token = localStorage.getItem(SESSION_KEY);
    if (!token) return;

    const res = await fetch(`${API_BASE}/api/dashboard-data`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    if (!res.ok) {
      localStorage.removeItem(SESSION_KEY);
      gate.style.display = "block";
      dashboard.style.display = "none";
      gateError.textContent = "Session expired. Please sign in again.";
      return;
    }

    const data = await res.json();

    gate.style.display = "none";
    dashboard.style.display = "block";

    const convBody = document.getElementById("conv-body");
    const resumeBody = document.getElementById("resume-body");

    document.getElementById("conv-count").textContent = data.conversations.length;
    document.getElementById("resume-count").textContent = data.resumeRequests.length;

    convBody.innerHTML = data.conversations.length
      ? data.conversations.map(c => `
          <tr>
            <td class="timestamp">${formatDate(c.timestamp)}</td>
            <td>${escapeHtml(c.question || "")}</td>
            <td>${escapeHtml(c.answer || "")}</td>
          </tr>
        `).join("")
      : `<tr><td colspan="3" class="empty-row">No conversations yet.</td></tr>`;

    resumeBody.innerHTML = data.resumeRequests.length
      ? data.resumeRequests.map(r => `
          <tr>
            <td class="timestamp">${formatDate(r.timestamp)}</td>
            <td>${escapeHtml(r.email || "")}</td>
          </tr>
        `).join("")
      : `<tr><td colspan="2" class="empty-row">No resume requests yet.</td></tr>`;
  }

  // Attempt to resume an existing session on page load.
  loadDashboard();
</script>

</body>
</html>
