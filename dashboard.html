<style>
:root {
    --bg: #F7F4EE;
    --bg-subtle: #EFEAE0;
    --ink: #1B1B1B;
    --ink-soft: #4A4A48;
    --rule: #D9D2C4;
    --accent: #6B1F1F;
    --display: "Fraunces", Georgia, serif;
    --body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
/* Gate screens */
  #gate {
    max-width: 420px;
    margin: 80px auto 0;
    text-align: center;
    padding: 40px 32px;
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 10px;
  }
#gate h2 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 22px;
    margin-bottom: 10px;
  }
#gate p {
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 22px;
  }
input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 14px;
    background: var(--bg);
    color: var(--ink);
  }
input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
  }
.username-input-row {
    position: relative;
    margin-bottom: 14px;
  }
.username-input-row input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    text-align: center;
  }
.username-input-row input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
.username-warning-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: opacity 150ms ease;
  }
.username-warning-icon svg {
    width: 22px;
    height: 22px;
  }
.username-warning-icon.hidden {
    display: none;
  }
button.primary {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
button.primary:hover { background: #551818; }
button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
#gate-error {
    color: var(--accent);
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
  }
.gate-toggle {
    margin-top: 20px;
    font-size: 13px;
    color: var(--ink-soft);
  }
.gate-toggle a {
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
  }
section.panel {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 10px;
    margin-bottom: 32px;
    overflow: hidden;
  }
.panel-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
.panel-header h2 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 18px;
  }
.panel-count {
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--bg-subtle);
    padding: 4px 10px;
    border-radius: 999px;
  }
table { width: 100%; border-collapse: collapse; }
th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    padding: 10px 22px;
    background: var(--bg-subtle);
  }
.hardstop-card.risk-medium .hardstop-risk-label {
    background: #9c690a;
  }
.hardstop-card.risk-medium .hardstop-warning-text {
    color: #9c690a;
  }
.hardstop-card.risk-medium .hardstop-btn.confirm {
    background: #c9860f;
    border-color: #c9860f;
  }
.hardstop-card.risk-medium .hardstop-btn.confirm:hover {
    background: #a66f0c;
  }
/* Maintenance log */
  #maintenance-log-panel { margin-bottom: 24px; }
#flagged-panel { margin-bottom: 24px; }
/* Conversation detail modal */
  #conversation-detail-overlay {
    position: fixed;
    inset: 0;
    z-index: 999997;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(20, 15, 10, 0.5);
    padding: 20px;
  }
#conversation-detail-overlay.visible { display: flex; }
.conversation-detail-card {
    width: min(640px, 100%);
    height: min(640px, 85vh);
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 70px rgba(0,0,0,0.35);
  }
.conversation-detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 18px 22px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg-subtle);
  }
  /* ---- Login backdrop: night cosmic / daytime rolling hills ---- */
  html, body { min-height: 100%; }
  body { min-height: 100vh; background: #0b0820; transition: background-color .6s; }
  body[data-sky="day"] { background: #cfe8f6; }
  #sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .sky-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
  body[data-sky="night"] #sky-night, body[data-sky="day"] #sky-day { opacity: 1; }

  /* night */
  #sky-night { background:
      radial-gradient(1000px 520px at 82% 14%, rgba(150,90,230,.38), transparent 62%),
      radial-gradient(900px 560px at 20% 30%, rgba(40,120,200,.30), transparent 64%),
      radial-gradient(900px 400px at 50% 78%, rgba(40,190,170,.20), transparent 66%),
      linear-gradient(180deg, #060822 0%, #12154a 48%, #2a2766 78%, #3a3a7a 100%); }
  .stars { position: absolute; top: 0; left: 0; border-radius: 50%; background: transparent; }
  .stars.s1 { width: 1px; height: 1px; animation: twinkle 5s ease-in-out infinite; }
  .stars.s2 { width: 2px; height: 2px; animation: twinkle 7s ease-in-out -2s infinite; }
  .stars.s3 { width: 3px; height: 3px; animation: twinkle 9s ease-in-out -4s infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .95; } 50% { opacity: .35; } }
  .shoot { position: absolute; width: 140px; height: 2px; opacity: 0;
    background: linear-gradient(90deg, rgba(255,255,255,.9), rgba(255,255,255,0));
    transform: rotate(-28deg); animation: shoot 11s linear infinite; }
  .shoot.b { animation-delay: 5.5s; top: 38%; left: 18%; }
  @keyframes shoot { 0% { opacity: 0; transform: translate(0,0) rotate(-28deg); }
    3% { opacity: 1; } 12% { opacity: 0; transform: translate(360px, 190px) rotate(-28deg); } 100% { opacity: 0; } }

  /* day */
  #sky-day { background: linear-gradient(180deg, #72d3e8 0%, #a9e7ee 34%, #e3f6ee 62%, #fff0cf 86%); }
  #sky-day .sun { position: absolute; top: 8%; right: 12%; left: auto; width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, #fffbe6 0%, #fff1b8 45%, rgba(255,236,170,0) 72%);
    box-shadow: 0 0 90px 50px rgba(255,240,190,.55); }
  #sky-day .cloud { position: absolute; fill: #fff; opacity: .85; animation: drift linear infinite; }
  #sky-day .cloud.c1 { top: 16%; width: 260px; animation-duration: 120s; left: -240px; }
  #sky-day .cloud.c2 { top: 26%; width: 150px; animation-duration: 160s; animation-delay: -60s; left: -240px; opacity: .7; }
  #sky-day .cloud.c3 { top: 8%;  width: 180px; animation-duration: 200s; animation-delay: -120s; left: -240px; opacity: .6; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 300px)); } }
  svg.scene { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }

  /* sun / half-moon switch */
  #sky-toggle { position: fixed; bottom: 18px; right: 18px; z-index: 5; display: inline-flex; gap: 4px;
    padding: 4px; border-radius: 999px; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.35);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  #sky-toggle button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; color: rgba(255,255,255,.75); transition: background .2s, color .2s, box-shadow .2s; }
  body[data-sky="day"] #sky-toggle button { color: rgba(60,60,80,.7); }
  #sky-toggle button svg { width: 20px; height: 20px; }
  #sky-toggle button:hover { background: rgba(255,255,255,.28); }
  #sky-toggle button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  #sky-toggle button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  #sky-sun[aria-pressed="true"] { color: #e0961a; }
  #sky-moon[aria-pressed="true"] { color: #3a3f8f; }
  #sky-copy { position: fixed; bottom: 22px; left: 22px; right: 150px; z-index: 5; font-size: 12px; line-height: 1.45;
    color: rgba(255,255,255,.78); text-shadow: 0 1px 6px rgba(5,3,22,.6); pointer-events: none; }
  body[data-sky="day"] #sky-copy { color: rgba(30,45,40,.82); text-shadow: 0 1px 4px rgba(255,255,255,.55); }
  #gate { position: relative; z-index: 2; background: rgba(255,255,255,.94); box-shadow: 0 18px 60px rgba(10,8,40,.35); }
  #app-frame { z-index: 10; }
  @media (prefers-reduced-motion: reduce) {
    .stars, .shoot, #sky-day .cloud, #sky-day .h1, #sky-day .h2, #sky-day .h3 { animation: none !important; }
    .sky-layer { transition: none; }
  }


  /* still scene: nothing in the backdrop moves */
  #sky, #sky * { animation: none !important; }
  .shoot { display: none; }
  .stars { opacity: .9; }
  #sky-day .cloud.c1 { left: 4%; top: 14%; } #sky-day .cloud.c2 { left: 80%; top: 31%; } #sky-day .cloud.c3 { left: 22%; top: 6%; }
  .balloon { transform: none; }
  /* single sun / moon button */
  #sky-toggle { padding: 0; gap: 0; width: 48px; height: 48px; justify-content: center; align-items: center; cursor: pointer; border: 1px solid rgba(255,255,255,.4); }
  #sky-toggle button { width: 48px; height: 48px; display: none; }
  #sky-toggle svg { width: 24px; height: 24px; }
  body[data-sky="night"] #sky-toggle #sky-sun { display: inline-flex; color: #ffd978; }
  body[data-sky="day"] #sky-toggle #sky-moon { display: inline-flex; color: #3a3f8f; }
  #sky-toggle button:hover { background: rgba(255,255,255,.28); }
  #sky-copy { right: 90px; }


  /* sign-in column: a full-height panel down the middle of the scene */
  body #gate { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(440px, 100vw); max-width: none;
    margin: 0; padding: 22vh 40px 90px; border-radius: 0; border: 0; overflow-y: auto; z-index: 2;
    box-shadow: 0 0 60px rgba(10,8,40,.28); transition: background-color .6s, color .6s; }
  body[data-sky="day"] #gate { background: rgba(236,239,243,.96); color: #26303b; }
  body[data-sky="night"] #gate { background: rgba(11,15,43,.94); color: #eef1ff; }
  body #gate h2 { font-size: 26px; letter-spacing: .01em; margin-bottom: 8px; }
  body[data-sky="day"] #gate p, body[data-sky="day"] #gate .gate-toggle { color: #55616e; }
  body[data-sky="night"] #gate p, body[data-sky="night"] #gate .gate-toggle { color: #aab3d9; }
  body[data-sky="night"] #gate .gate-toggle a, body[data-sky="night"] #gate-error { color: #ff8da3; }
  body #gate .username-input-row { margin: 34px 0 18px; }
  body #gate .username-input-row input[type="text"] { border-radius: 0; background: #fff; color: #1d2530; border: 1px solid #9aa5b1; padding: 11px 12px; }
  body[data-sky="night"] #gate .username-input-row input[type="text"] { border-color: #c9d0f2; }
  body #gate button.primary { border-radius: 0; }
  @media (max-width: 900px) { #sky-copy { right: 76px; font-size: 11px; } body #gate { padding-top: 16vh; } }
  @media (min-width: 901px) { #sky-copy { right: calc(50% + 240px); } }


  /* red buttons + square sun/moon flip button */
  body[data-sky="day"] #gate button.primary { background: #b5123f; }
  body[data-sky="day"] #gate button.primary:hover { background: #99103a; }
  body[data-sky="night"] #gate button.primary { background: #e0244e; }
  body[data-sky="night"] #gate button.primary:hover { background: #c81d45; }
  body[data-sky="day"] #gate .gate-toggle a, body[data-sky="day"] #gate-error { color: #b5123f; }
  #username-warning-icon path { fill: #c8133f; }
  #sky-toggle { width: 38px; height: 38px; border-radius: 4px; background: #fff; border: 1px solid rgba(0,0,0,.2);
    box-shadow: 0 1px 4px rgba(0,0,0,.3); -webkit-backdrop-filter: none; backdrop-filter: none; bottom: 14px; right: 14px; }
  #sky-toggle button { width: 38px; height: 38px; border-radius: 4px; }
  #sky-toggle svg { width: 22px; height: 22px; }
  #sky-toggle button:hover { background: #eef1f5; }
  body[data-sky="night"] #sky-toggle #sky-sun { color: #e8920c; }
  body[data-sky="day"] #sky-toggle #sky-moon { color: #2b2f55; }

  /* illustrated scene details */
  .balloon { animation: bob 9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bob { from { transform: translateY(-10px) rotate(-1.5deg); } to { transform: translateY(12px) rotate(1.5deg); } }
  .beam { animation: beamPulse 6s ease-in-out infinite alternate; }
  @keyframes beamPulse { from { opacity: .55; } to { opacity: .95; } }
  .fly { animation: twinkle 3.2s ease-in-out infinite; }
  .fly:nth-child(2n) { animation-duration: 4.4s; animation-delay: -1.1s; }
  .fly:nth-child(3n) { animation-duration: 5.1s; animation-delay: -2.3s; }
  .aurora { animation: auroraShift 18s ease-in-out infinite alternate; }
  @keyframes auroraShift { from { transform: translateX(-30px); opacity: .55; } to { transform: translateX(30px); opacity: .95; } }
  @media (prefers-reduced-motion: reduce) { .balloon, .beam, .fly, .aurora { animation: none !important; } }

  #app-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); display: none; }

</style>

      <path d="M6.5 6.2 C7.2 5.2 8.5 4.6 9.6 4.8" stroke="rgba(255,255,255,0.35)" stroke-width="1.3" fill="none" stroke-linecap="round"/>

<iframe id="app-frame" title="Dashboard"></iframe>

<script>
  const API_BASE = "https://tylerjanczak-github-io.vercel.app";
  const SESSION_KEY = "tylerDashboardSession";

  // ---- Device-bound session ------------------------------------------
  // At sign-in this browser creates a signing key that can NEVER be
  // exported (WebCrypto non-extractable, kept in IndexedDB). The server
  // binds the session to its public half, and every request to the API is
  // signed with it. A session token copied to another device or script
  // can't produce valid signatures, so it's useless there.
  const DeviceKey = (() => {
    const DB_NAME = "tylerDashDevice";
    const STORE = "keys";
    const KEY_ID = "signing-key";
    let memoryKey = null; // fallback if IndexedDB is unavailable (lost on reload)

    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idb(mode, run) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, mode);
        const request = run(tx.objectStore(STORE));
        tx.oncomplete = () => { db.close(); resolve(request ? request.result : undefined); };
        tx.onerror = () => { db.close(); reject(tx.error); };
      });
    }

    async function create() {
      const pair = await crypto.subtle.generateKey(
        { name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]
      );
      try {
        await idb("readwrite", (store) => store.put(pair.privateKey, KEY_ID));
        memoryKey = null;
      } catch {
        memoryKey = pair.privateKey;
      }
      const jwk = await crypto.subtle.exportKey("jwk", pair.publicKey);
      return { kty: "EC", crv: "P-256", x: jwk.x, y: jwk.y };
    }

    async function get() {
      if (memoryKey) return memoryKey;
      try {
        return (await idb("readonly", (store) => store.get(KEY_ID))) || null;
      } catch {
        return null;
      }
    }

    async function remove() {
      memoryKey = null;
      try { await idb("readwrite", (store) => store.delete(KEY_ID)); } catch { /* nothing to remove */ }
    }

    const toB64Url = (buf) =>
      btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    const toHex = (buf) =>
      Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");

    async function proofFor(method, pathAndQuery, token) {
      const key = await get();
      if (!key) return null;
      const ts = String(Date.now());
      const nonce = toHex(crypto.getRandomValues(new Uint8Array(16)));
      const tokenHash = toHex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(token)));
      const message = `${method}\n${pathAndQuery}\n${ts}\n${nonce}\n${tokenHash}`;
      const sig = await crypto.subtle.sign(
        { name: "ECDSA", hash: "SHA-256" }, key, new TextEncoder().encode(message)
      );
      return `${ts}.${nonce}.${toB64Url(sig)}`;
    }

    return { create, remove, proofFor };
  })();

  // Every call to the API with a session token gets a fresh signature.
  const nativeFetch = window.fetch.bind(window);
  window.fetch = async (input, init = {}) => {
    try {
      if (typeof input === "string") {
        const url = new URL(input, window.location.href);
        if (url.origin === new URL(API_BASE).origin) {
          const headers = new Headers(init.headers || {});
          let token = headers.get("X-Dashboard-Session") || "";
          if (!token && url.pathname !== "/api/webauthn") {
            const auth = headers.get("Authorization") || "";
            if (auth.startsWith("Bearer ")) token = auth.slice(7);
          }
          if (token) {
            const proof = await DeviceKey.proofFor((init.method || "GET").toUpperCase(), url.pathname + url.search, token);
            if (proof) headers.set("X-Dashboard-Proof", proof);
          }
          return nativeFetch(input, { ...init, headers });
        }
      }
    } catch (err) {
      console.error("Could not sign request:", err);
    }
    return nativeFetch(input, init);
  };
  const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;

  const gate = document.getElementById("gate");
  const gateError = document.getElementById("gate-error");
  const usernameView = document.getElementById("username-view");
  const signinView = document.getElementById("signin-view");
  const registerView = document.getElementById("register-view");
  const gateTitle = document.getElementById("gate-title");
  const gateSubtitle = document.getElementById("gate-subtitle");

  // Cosmetic username step before the passkey prompt — this is a single-admin
  // dashboard, so this isn't a real access boundary (the passkey itself is);
  // it just makes the login flow feel like a familiar two-step sign-in.
  const EXPECTED_USERNAME = "tyler";

  const usernameInputEl = document.getElementById("username-input");
  const usernameWarningIcon = document.getElementById("username-warning-icon");

  usernameInputEl.addEventListener("input", () => {
    usernameWarningIcon.classList.toggle("hidden", usernameInputEl.value.length > 0);
  });

  usernameInputEl.addEventListener("blur", () => {
    usernameWarningIcon.classList.toggle("hidden", usernameInputEl.value.length > 0);
  });

  document.getElementById("username-continue-btn").addEventListener("click", () => {
    const entered = document.getElementById("username-input").value.trim().toLowerCase();

    // Invited people type their own name; the passkey is the real check.
    if (!entered) {
      gateError.textContent = "Enter your username.";
      return;
    }

    gateError.textContent = "";
    usernameView.style.display = "none";
    signinView.style.display = "block";
    gateSubtitle.textContent = "Use your passkey to access the dashboard.";
  });

  document.getElementById("username-input").addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("username-continue-btn").click();
    }
  });

  document.getElementById("username-back-signin").addEventListener("click", () => {
    signinView.style.display = "none";
    usernameView.style.display = "block";
    gateSubtitle.textContent = "Enter your username to continue.";
    gateError.textContent = "";
  });

  // The "Register one" link stays hidden for a cleaner sign-in screen.
  // Visit dashboard.html?setup=1 to reveal it when adding a new device.
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get("setup") === "1") {
    document.getElementById("register-toggle").style.display = "block";
  }

  document.getElementById("show-register").addEventListener("click", () => {
    signinView.style.display = "none";
    registerView.style.display = "block";
    gateTitle.textContent = "Set Up Passkey";
    gateSubtitle.textContent = "Enter the dashboard password or your invite code once to register your passkey.";
    gateError.textContent = "";
  });

  document.getElementById("show-signin").addEventListener("click", () => {
    registerView.style.display = "none";
    signinView.style.display = "block";
    gateTitle.textContent = "Sign In";
    gateSubtitle.textContent = "Use your passkey to access the dashboard.";
    gateError.textContent = "";
  });

  async function registerPasskey() {
    gateError.textContent = "";
    const password = document.getElementById("register-password").value.trim();

    if (!password) {
      gateError.textContent = "Enter the dashboard password.";
      return;
    }

    try {
      const optionsRes = await fetch(`${API_BASE}/api/webauthn?action=register-options`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${password}`,
          // If you're already signed in (adding a second device), prove it.
          "X-Dashboard-Session": localStorage.getItem(SESSION_KEY) || ""
        }
      });

      const options = await optionsRes.json();

      if (!optionsRes.ok) {
        gateError.textContent = options.error || "Incorrect password.";
        return;
      }

      console.log("Registration options received from server:", options);
      const authOverlay = document.getElementById("auth-overlay");
      authOverlay.classList.add("visible");
      const attResp = await startRegistration({ optionsJSON: options });
      authOverlay.classList.remove("visible");

      const verifyRes = await fetch(`${API_BASE}/api/webauthn?action=register-verify`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${password}`,
          "X-Dashboard-Session": localStorage.getItem(SESSION_KEY) || ""
        },
        body: JSON.stringify({ response: attResp, challengeId: options.challengeId })
      });

      const verifyData = await verifyRes.json();

      if (!verifyRes.ok || !verifyData.verified) {
        gateError.textContent = verifyData.error || "Registration failed.";
        return;
      }

      gateError.style.color = "#2e7d32";
      gateError.textContent = "Passkey registered! Signing you in...";
      await signInPasskey();
    } catch (err) {
      console.error(err);
      gateError.textContent = "Registration failed: " + (err.message || err.name || "unknown error");
      document.getElementById("auth-overlay").classList.remove("visible");
    }
  }

  async function signInPasskey() {
    gateError.textContent = "";
    const authOverlay = document.getElementById("auth-overlay");

    try {
      const optionsRes = await fetch(`${API_BASE}/api/webauthn?action=auth-options`, {
        method: "POST"
      });

      const options = await optionsRes.json();

      if (!optionsRes.ok) {
        gateError.textContent = options.error || "No passkey registered yet.";
        return;
      }

      authOverlay.classList.add("visible");
      const authResp = await startAuthentication({ optionsJSON: options });
      // New signing key for this device; the session will be bound to it.
      const devicePublicKey = await DeviceKey.create();

      const verifyRes = await fetch(`${API_BASE}/api/webauthn?action=auth-verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ response: authResp, challengeId: options.challengeId, devicePublicKey })
      });

      const verifyData = await verifyRes.json();

      if (!verifyRes.ok || !verifyData.verified) {
        gateError.textContent = verifyData.error || "Sign-in failed.";
        return;
      }

      localStorage.setItem(SESSION_KEY, verifyData.sessionToken);
      await launchApp();
    } catch (err) {
      console.error(err);
      gateError.textContent = "Sign-in failed: " + (err.message || err.name || "unknown error");
    } finally {
      authOverlay.classList.remove("visible");
    }
  }

  document.getElementById("register-btn").addEventListener("click", registerPasskey);
  document.getElementById("signin-btn").addEventListener("click", signInPasskey);


  // ---- Login backdrop: day from 7:00, night from 19:00, or pick manually ----
  (function () {
    var body = document.body;
    var sun = document.getElementById("sky-sun");
    var moon = document.getElementById("sky-moon");

    // stars: seeded so the sky looks the same every visit
    var seed = 20261015;
    function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
    function field(count, colors) {
      var w = Math.max(window.innerWidth, 1400), h = Math.max(window.innerHeight, 900), out = [];
      for (var i = 0; i < count; i++) {
        out.push(Math.round(rnd() * w) + "px " + Math.round(rnd() * h) + "px 0 " + colors[Math.floor(rnd() * colors.length)]);
      }
      return out.join(",");
    }
    var tints = ["#ffffff", "#dfe8ff", "#ffeedd", "#e9ddff"];
    document.getElementById("stars1").style.boxShadow = field(150, tints);
    document.getElementById("stars2").style.boxShadow = field(60, tints);
    document.getElementById("stars3").style.boxShadow = field(14, ["#ffffff", "#cfe0ff"]);

    function scheduled() { var h = new Date().getHours(); return (h >= 7 && h < 19) ? "day" : "night"; }
    function apply(mode) {
      body.setAttribute("data-sky", mode);
    }
    var lastScheduled = scheduled();
    apply(lastScheduled);
    sun.addEventListener("click", function () { apply("day"); });
    moon.addEventListener("click", function () { apply("night"); });
    // At 7:00 / 19:00 the schedule takes over again from any manual pick.
    setInterval(function () {
      var s = scheduled();
      if (s !== lastScheduled) { lastScheduled = s; apply(s); }
    }, 15000);
  })();

  // The dashboard itself is NOT in this page. After a verified, device-signed
  // sign-in the server sends it, and it runs inside a frame.
  const appFrame = document.getElementById("app-frame");

  async function launchApp() {
    const token = localStorage.getItem(SESSION_KEY);
    if (!token) return false;
    let res;
    try {
      res = await fetch(`${API_BASE}/api/dashboard?action=app`, { headers: { Authorization: `Bearer ${token}` } });
    } catch (err) {
      gateError.textContent = "Could not reach the server.";
      return false;
    }
    if (!res.ok) {
      const why = await res.json().then((d) => d.reason).catch(() => null);
      localStorage.removeItem(SESSION_KEY);
      gate.style.display = "block";
      gateError.textContent = "Session expired. Please sign in again." + (why ? " (" + why + ")" : " (HTTP " + res.status + ")");
      return false;
    }
    const html = await res.text();
    gate.style.display = "none";
    appFrame.setAttribute("allow", "clipboard-write; publickey-credentials-get");
    appFrame.srcdoc = html;
    appFrame.style.display = "block";
    var skyEl = document.getElementById("sky"), skyTg = document.getElementById("sky-toggle"), skyCp = document.getElementById("sky-copy");
    if (skyEl) skyEl.style.display = "none";
    if (skyTg) skyTg.style.display = "none";
    if (skyCp) skyCp.style.display = "none";
    return true;
  }

  try {
    const msg = sessionStorage.getItem("dashGateMsg");
    if (msg) { gateError.textContent = msg; sessionStorage.removeItem("dashGateMsg"); }
  } catch (e) {}

  // Resume an existing session on page load.
  launchApp();
</script>
